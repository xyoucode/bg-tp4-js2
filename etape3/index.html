<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TP 4 - Etape 3: Insertion à partir d'un tableau d'objets</title>
    <!-- Slide 24: Linking external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container for the table -->
    <div id="table_container">
        <table>
            <tr>
                <th class="col_number">N°</th>
                <th class="col_text">Nom</th>
                <th class="col_text">Prénom</th>
                <th class="col_number">Points</th>
                <th class="col_chkbox">Select</th>
            </tr>
            <!-- Rows are now dynamically inserted via JavaScript -->
        </table>
    </div>

    <!-- Buttons for actions (Slide 14, 29) -->
    <div style="text-align: center; margin-top: 20px;">
        <button onclick="doInsert('nom-test', 'prenom-test', 20)">Ajouter</button>
        <button onclick="consoleTableau()">Console Tableau</button>
    </div>

    <!-- Slide 24, 26-27: Inclusion of external JavaScript file at the end of body -->
    <script src="script.js"></script>
</body>
</html>
